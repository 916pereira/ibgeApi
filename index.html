
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição em Evento</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Inscrição em Evento</h1>
        <p>Preencha seus dados para participar do evento.</p>

        <form id="formInscricao">
            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="estado">Estado</label>
            <select id="estado" required>
                <option value="">Carregando estados...</option>
            </select>

            <label for="cidade">Cidade</label>
            <select id="cidade" required disabled>
                <option value="">Selecione primeiro um estado</option>
            </select>

            <p id="quantidadeCidades">Selecione um estado.</p>

            <label for="filtroCidade">Filtrar cidades</label>
            <input
                type="text"
                id="filtroCidade"
                placeholder="Digite o nome da cidade"
                disabled
            >

            <button type="submit">Inscrever</button>
        </form>

        <div id="mensagem" aria-live="polite"></div>
    </main>

</body>
</html>
